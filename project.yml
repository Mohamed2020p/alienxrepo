# XcodeGen spec for EIGHT BALL (https://github.com/yonaskolb/XcodeGen, 2.38+)
#   xcodegen generate --spec project.yml
# Bitrise runs this first; if XcodeGen is unavailable the committed EightBall.xcodeproj (tools/gen_xcodeproj.py) is used.
# Keep this file and tools/gen_xcodeproj.py consistent (same target, same settings).
name: EightBall

options:
  minimumXcodeGenVersion: 2.38.0
  bundleIdPrefix: com.c0derz
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Release
  deploymentTarget:
    iOS: "16.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SDKROOT: iphoneos
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_OPTIMIZATION_LEVEL: "0"
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      DEBUG_INFORMATION_FORMAT: dwarf
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: s
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      VALIDATE_PRODUCT: YES

targets:
  EightBall:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: EightBall
        excludes:
          - "Resources/Data/**"
          - "Resources/Audio/**"
          - "Resources/Info.plist"
          - "**/.gitkeep"
          - "**/*.md"
          - "**/*.py"
      - path: EightBall/Resources/Data
        type: folder
        buildPhase: resources
      - path: EightBall/Resources/Audio
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: SceneKit.framework
      - sdk: SwiftUI.framework
      - sdk: UIKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreHaptics.framework
      - sdk: Combine.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.c0derz.eightball
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: EightBall/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: NO
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          GCC_OPTIMIZATION_LEVEL: "0"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          GCC_OPTIMIZATION_LEVEL: s

  EightBallTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: EightBallTests
    dependencies:
      - target: EightBall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.c0derz.eightball.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EightBall.app/EightBall"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO

schemes:
  EightBall:
    build:
      targets:
        EightBall: all
        EightBallTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EightBallTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: false
